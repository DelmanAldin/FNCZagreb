<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNC 33 Zagreb 🥊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4c1d95">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FNC 33">
<link rel="apple-touch-icon" href="fnc.png">
<style>
:root {
  --bg:      #f5f3ff;
  --surface: #ffffff;
  --sf2:     #ede9fe;
  --border:  #c4b5fd;
  --shadow:  rgba(109,40,217,0.08);
  --accent:  #7c3aed;
  --acc-d:   rgba(124,58,237,0.10);
  --red:     #dc2626;
  --red-d:   rgba(220,38,38,0.10);
  --orange:  #ea580c;
  --gold:    #d97706;
  --gold-d:  rgba(217,119,6,0.12);
  --green:   #059669;
  --grn-d:   rgba(5,150,105,0.10);
  --blue:    #2563eb;
  --text:    #1e1b4b;
  --text2:   #4c4891;
  --muted:   #8b85c1;
  --r: 10px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse at top,#ede9fe 0%,#f5f3ff 65%);
  color:var(--text);font-family:'Barlow',sans-serif;
  min-height:100vh;max-width:740px;margin:0 auto;font-size:15px;
}

/* ── HEADER ── */
.header{
  background:linear-gradient(135deg,#2e1065 0%,#4c1d95 50%,#2e1065 100%);
  border-bottom:3px solid var(--accent);
  position:sticky;top:0;z-index:200;
  box-shadow:0 3px 24px rgba(109,40,217,0.3);
}
.header-inner{padding:12px 16px 0;}
.header-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.logo{font-family:'Bebas Neue',cursive;font-size:24px;letter-spacing:3px;color:#fff;line-height:1;}
.logo em{color:#c4b5fd;font-style:normal;}
.event-pill{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  background:linear-gradient(135deg,var(--accent),#a855f7);
  color:#fff;padding:4px 12px;border-radius:20px;
  box-shadow:0 2px 8px rgba(124,58,237,0.4);
}
.header-right{display:flex;align-items:center;gap:8px;margin-left:auto;}
.live-badge{
  display:none;
  font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  background:var(--red);color:#fff;padding:3px 8px;border-radius:20px;
  animation:pulse 2s infinite;
}
.live-badge.on{display:inline-block;}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(220,38,38,0.4)}50%{opacity:.9;box-shadow:0 0 0 4px rgba(220,38,38,0)}}
.mgr-btn{
  background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);
  color:rgba(255,255,255,0.5);border-radius:8px;
  padding:5px 10px;cursor:pointer;transition:all 0.2s;
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;
  display:flex;align-items:center;gap:5px;
}
.mgr-btn:hover{background:rgba(255,255,255,0.15);color:rgba(255,255,255,0.9);}
.mgr-btn.active{background:rgba(245,196,0,0.15);border-color:var(--gold);color:var(--gold);}
.nav{display:flex;}
.nav-btn{
  flex:1;background:transparent;border:none;border-bottom:3px solid transparent;
  color:rgba(255,255,255,0.4);
  font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
  padding:9px 4px;cursor:pointer;transition:all 0.2s;
}
.nav-btn:hover{color:rgba(255,255,255,0.8);}
.nav-btn.active{color:#fff;border-bottom-color:#c4b5fd;}

/* ── CONTENT ── */
.content{padding:20px 16px 40px;}
.tab{display:none;}.tab.active{display:block;}
.stitle{
  font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:2px;
  display:flex;align-items:center;gap:10px;margin-bottom:14px;color:var(--text);
}
.stitle::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border),transparent);}

/* ── CARD ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;margin-bottom:10px;box-shadow:0 2px 10px var(--shadow);}
.card-body{padding:14px;}
.card-head{background:var(--sf2);padding:9px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border);}
.badge{font-family:'Bebas Neue',cursive;font-size:12px;letter-spacing:0.5px;padding:2px 9px;border-radius:20px;}
.badge-p{background:var(--accent);color:#fff;}
.badge-g{background:var(--green);color:#fff;}

/* ── SETUP FIGHT LIST ── */
.fight-locked-row{display:flex;align-items:center;padding:11px 14px;gap:10px;border-bottom:1px solid var(--border);}
.fight-locked-row:last-child{border-bottom:none;}
.fnum{font-family:'Bebas Neue',cursive;font-size:20px;color:var(--accent);min-width:24px;text-align:center;line-height:1;}
.fname{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:600;flex:1;color:var(--text);}
.vsd{font-family:'Bebas Neue',cursive;font-size:13px;color:var(--muted);}

/* ── FIGHTER PHOTO BUTTONS ── */
.fighter-row{display:flex;gap:10px;margin-bottom:12px;align-items:stretch;}
.vs-mid{display:flex;align-items:center;justify-content:center;flex-shrink:0;width:26px;
  font-family:'Bebas Neue',cursive;font-size:15px;color:var(--muted);}

.f-btn{
  flex:1;background:var(--sf2);border:2px solid var(--border);
  border-radius:var(--r);cursor:pointer;transition:all 0.18s;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;position:relative;
  padding-bottom:8px;
}
.f-btn:hover{border-color:var(--accent);transform:translateY(-1px);box-shadow:0 4px 16px rgba(124,58,237,0.15);}
.f-btn.sel{border-color:var(--accent);background:var(--acc-d);box-shadow:0 0 0 1px var(--accent),0 4px 16px rgba(124,58,237,0.2);}
.f-btn.wsel{border-color:var(--gold);background:var(--gold-d);box-shadow:0 0 0 1px var(--gold),0 4px 16px rgba(217,119,6,0.2);}

.f-img{width:100%;height:110px;object-fit:contain;object-position:center bottom;display:block;}
.f-label{
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
  padding:4px 6px 0;text-align:center;line-height:1.2;color:var(--text2);
}
.f-btn.sel .f-label{color:var(--accent);}
.f-btn.wsel .f-label{color:var(--gold);}

.sel-check{
  position:absolute;top:5px;right:5px;width:20px;height:20px;border-radius:50%;
  background:var(--accent);color:#fff;font-size:11px;font-weight:900;
  display:flex;align-items:center;justify-content:center;
  opacity:0;transition:opacity 0.15s;
}
.f-btn.sel .sel-check{opacity:1;}
.f-btn.wsel .sel-check{opacity:1;background:var(--gold);}

/* read-only fighter display (tickets) */
.f-btn-ro{
  flex:1;background:var(--sf2);border:2px solid var(--border);
  border-radius:var(--r);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
  padding-bottom:8px;
}
.f-btn-ro.sel{border-color:var(--accent);background:var(--acc-d);}
.f-btn-ro .f-label{color:var(--text2);}
.f-btn-ro.sel .f-label{color:var(--accent);}

/* ── METHOD BUTTONS ── */
.pick-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:6px;}
.method-btns{display:flex;gap:6px;flex-wrap:wrap;}
.method-btn{
  background:var(--sf2);border:2px solid var(--border);color:var(--text2);
  border-radius:6px;padding:7px 12px;
  font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:0.5px;
  cursor:pointer;transition:all 0.15s;
}
.method-btn:hover{border-color:var(--muted);background:#fff;}
.method-btn.s-ko{border-color:var(--red);background:var(--red-d);color:var(--red);}
.method-btn.s-sub{border-color:var(--orange);background:rgba(234,88,12,0.10);color:var(--orange);}
.method-btn.s-bod{border-color:var(--blue);background:rgba(37,99,235,0.10);color:var(--blue);}
.method-btn.s-ost{border-color:var(--muted);background:rgba(139,133,193,0.10);color:var(--muted);}

/* ── TICKETS VIEW ── */
.ptabs{display:flex;gap:5px;margin-bottom:16px;flex-wrap:wrap;}
.ptab{
  flex:1;min-width:60px;background:var(--surface);border:2px solid var(--border);color:var(--muted);
  border-radius:var(--r);padding:9px 4px;
  font-family:'Bebas Neue',cursive;font-size:15px;letter-spacing:1px;
  cursor:pointer;transition:all 0.15s;text-align:center;line-height:1.2;
  box-shadow:0 1px 4px var(--shadow);
}
.ptab:hover{border-color:var(--accent);color:var(--accent);}
.ptab.active{border-color:var(--accent);color:var(--accent);background:var(--acc-d);}
.ptab .psub{display:block;font-family:'Barlow',sans-serif;font-size:9px;font-weight:600;letter-spacing:0.5px;margin-top:2px;color:var(--green);}

/* method pill in read-only ticket */
.mpill{
  font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;
  padding:3px 9px;border-radius:20px;display:inline-block;margin-top:4px;
}
.mp-ko{background:var(--red-d);color:var(--red);border:1px solid rgba(220,38,38,0.25);}
.mp-sub{background:rgba(234,88,12,0.10);color:var(--orange);border:1px solid rgba(234,88,12,0.25);}
.mp-bod{background:rgba(37,99,235,0.10);color:var(--blue);border:1px solid rgba(37,99,235,0.25);}
.mp-ost{background:rgba(139,133,193,0.10);color:var(--muted);border:1px solid var(--border);}

/* ── DOTS ── */
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-done{background:var(--green);box-shadow:0 0 6px var(--green);}
.dot-pend{background:var(--red);animation:blink 1.4s infinite;}
.dot-idle{background:var(--border);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* ── LIVE RESULT ── */
.result-box{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 12px;gap:12px;}
.winner-n{font-family:'Bebas Neue',cursive;font-size:26px;color:var(--gold);letter-spacing:1px;line-height:1;}
.winner-s{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px;}
.mtag{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;letter-spacing:1px;padding:4px 10px;border-radius:20px;}
.mt-ko{background:var(--red-d);color:var(--red);border:1px solid rgba(220,38,38,0.3);}
.mt-sub{background:rgba(234,88,12,0.12);color:var(--orange);border:1px solid rgba(234,88,12,0.3);}
.mt-bod{background:rgba(37,99,235,0.12);color:var(--blue);border:1px solid rgba(37,99,235,0.3);}
.mt-ost{background:rgba(139,133,193,0.12);color:var(--muted);border:1px solid var(--border);}

/* read-only pending fight */
.fight-pending-ro{display:flex;align-items:center;padding:14px;gap:12px;}
.fp-names{flex:1;}
.fp-f1{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--text);line-height:1.2;}
.fp-vs{font-family:'Bebas Neue',cursive;font-size:11px;color:var(--muted);margin:2px 0;}
.fp-f2{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:700;color:var(--text);line-height:1.2;}
.pending-tag{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);padding:4px 10px;border-radius:20px;border:1px solid var(--border);background:var(--sf2);}

/* ── PROGRESS BAR ── */
.pbar{height:4px;background:var(--sf2);border-radius:2px;overflow:hidden;margin-bottom:16px;}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--accent),#a855f7);border-radius:2px;transition:width 0.4s ease;}

/* ── SCOREBOARD ── */
.score-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border);gap:14px;transition:background 0.15s;}
.score-row:hover{background:rgba(124,58,237,0.03);}
.score-row:last-child{border-bottom:none;}
.rank-n{font-family:'Bebas Neue',cursive;font-size:26px;min-width:34px;text-align:center;line-height:1;}
.r1{color:var(--gold);}.r2{color:#888;}.r3{color:#b87333;}.rn{color:var(--muted);}
.score-nm{font-family:'Bebas Neue',cursive;font-size:24px;letter-spacing:1.5px;flex:1;color:var(--text);}
.score-pts{font-family:'Bebas Neue',cursive;font-size:36px;color:var(--accent);line-height:1;}
.score-sub{font-family:'Barlow Condensed',sans-serif;font-size:11px;color:var(--muted);text-align:right;margin-top:2px;}

/* ── BREAKDOWN TABLE ── */
.btable{width:100%;border-collapse:collapse;font-family:'Barlow Condensed',sans-serif;font-size:13px;}
.btable th{background:var(--sf2);padding:7px 10px;text-align:left;font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);}
.btable td{padding:8px 10px;border-bottom:1px solid #ede9fe;line-height:1.3;}
.btable tr:last-child td{border-bottom:none;}
.tc{color:var(--green);font-weight:700;}.tw{color:var(--red);}.tp{color:var(--muted);}
.pts-pill{display:inline-block;font-family:'Bebas Neue',cursive;font-size:14px;padding:1px 8px;border-radius:20px;}
.pts-ok{background:var(--grn-d);color:var(--green);border:1px solid rgba(5,150,105,0.3);}
.pts-0{color:var(--muted);}

/* ── SETUP BANNER ── */
.setup-banner{background:linear-gradient(135deg,#fef3c7,#fffbeb);border:1px solid #fbbf24;border-radius:var(--r);padding:14px;margin-bottom:16px;}
.setup-banner h3{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:1px;color:#92400e;margin-bottom:6px;}
.setup-banner p{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#78350f;line-height:1.5;margin-top:4px;}
.setup-banner code{font-size:12px;background:rgba(0,0,0,0.07);padding:2px 5px;border-radius:3px;}
.setup-banner ol{margin:8px 0 0 16px;}
.setup-banner li{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:#78350f;line-height:1.7;}

/* ── MGR MODE BANNER ── */
.mgr-banner{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#fef9c3,#fefce8);border:1px solid var(--gold);border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--gold);font-weight:700;letter-spacing:0.5px;}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);display:inline-block;margin-right:4px;animation:blink 2s infinite;}

/* ── PASSWORD MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(30,27,74,0.75);backdrop-filter:blur(4px);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.hidden{display:none;}
.modal-box{background:var(--surface);border-radius:16px;padding:28px 24px;width:100%;max-width:360px;box-shadow:0 20px 60px rgba(109,40,217,0.25);border:1px solid var(--border);}
.modal-title{font-family:'Bebas Neue',cursive;font-size:24px;letter-spacing:2px;color:var(--text);margin-bottom:4px;}
.modal-sub{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--muted);margin-bottom:18px;}
.pwd-input{width:100%;background:var(--sf2);border:2px solid var(--border);border-radius:8px;color:var(--text);font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:4px;padding:12px 14px;outline:none;transition:border-color 0.2s;text-align:center;-webkit-text-security:disc;}
.pwd-input:focus{border-color:var(--accent);}
.pwd-error{font-family:'Barlow Condensed',sans-serif;font-size:13px;color:var(--red);margin-top:6px;display:none;}
.modal-btns{display:flex;gap:8px;margin-top:16px;}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:6px;font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:all 0.15s;white-space:nowrap;}
.btn-sm{font-size:12px;padding:7px 14px;}
.btn-md{font-size:14px;padding:10px 20px;}
.btn-p{background:var(--accent);color:#fff;box-shadow:0 2px 8px rgba(124,58,237,0.3);}
.btn-p:hover{filter:brightness(1.1);}
.btn-g{background:var(--sf2);color:var(--text2);border:1px solid var(--border);}
.btn-g:hover{color:var(--text);border-color:var(--muted);background:#fff;}
.btn-d{background:transparent;color:var(--red);border:1px solid var(--red);}
.btn-d:hover{background:var(--red-d);}
.btn-full{width:100%;}
.edit-btn{background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:4px;padding:4px 8px;font-family:'Barlow Condensed',sans-serif;font-size:11px;cursor:pointer;}
.edit-btn:hover{border-color:var(--accent);color:var(--accent);}

/* ── MISC ── */
.info{font-family:'Barlow Condensed',sans-serif;font-size:14px;color:var(--muted);line-height:1.6;margin-bottom:14px;}
.fight-matchup-text{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:var(--text);flex:1;}
.fight-matchup-text em{color:var(--muted);font-style:normal;font-size:11px;}
.flex{display:flex;}.gap8{gap:8px;}.jend{justify-content:flex-end;}.mt20{margin-top:20px;}
.dz{margin-top:32px;padding:14px;border:1px dashed rgba(220,38,38,0.25);border-radius:var(--r);}
.dz-t{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--red);margin-bottom:10px;}
@media(max-width:420px){
  .ptab{font-size:13px;padding:8px 2px;}
  .method-btn{padding:6px 8px;font-size:12px;}
  .score-nm{font-size:20px;}.score-pts{font-size:30px;}
  .f-img{height:85px;}
  .f-label{font-size:12px;}
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="header-top">
      <div class="logo">🥊 <em>FNC</em> OPKLADA</div>
      <span class="event-pill">FNC 33 · ZAGREB</span>
      <div class="header-right">
        <span class="live-badge" id="live-badge">⚡ LIVE</span>
        <button class="mgr-btn" id="mgr-btn" onclick="openMgrModal()">🔐 <span id="mgr-label">Upravljanje</span></button>
      </div>
    </div>
    <nav class="nav">
      <button class="nav-btn active" onclick="goTab('setup')">📋 Borbe</button>
      <button class="nav-btn" onclick="goTab('tickets')">🎟 Listići</button>
      <button class="nav-btn" onclick="goTab('live')">🔴 Live</button>
      <button class="nav-btn" onclick="goTab('results')">🏆 Tabela</button>
    </nav>
  </div>
</div>

<div class="content">

  <div id="tab-setup" class="tab active">
    <div class="stitle">🥊 Borbe — FNC 33</div>
    <p class="info">10 borbi. Prati rezultate na kartici <strong>Live</strong> — sve se osvježava u realnom vremenu. 🔴</p>
    <div id="fights-list"></div>
    <div class="dz mt20" id="mgr-dz" style="display:none">
      <div class="dz-t">⚠ Danger Zone</div>
      <button class="btn btn-sm btn-d" onclick="resetResults()">Resetuj sve rezultate</button>
    </div>
  </div>

  <div id="tab-tickets" class="tab">
    <div class="stitle">🎟 Listići</div>
    <div id="ptabs-row" class="ptabs"></div>
    <div id="ticket-view"></div>
  </div>

  <div id="tab-live" class="tab">
    <div class="stitle">🔴 Live Rezultati</div>
    <div class="pbar"><div class="pbar-fill" id="pbar-fill" style="width:0%"></div></div>
    <div id="live-view"></div>
  </div>

  <div id="tab-results" class="tab">
    <div class="stitle">🏆 Rang Lista</div>
    <div id="scoreboard-view"></div>
    <div class="stitle">📊 Detalji</div>
    <div id="breakdown-view"></div>

      results = snap.val() || {};

  try {

  } catch(e) {}

function localSave() {
  if (!FB_OK) try { localStorage.setItem('fnc33_results', JSON.stringify(results)); } catch(e) {}
}
function writeResult(fid, data) {
  if (db) db.ref('fnc33/results/'+fid).set(data);
  else { results[fid]=data; localSave(); renderLive(); renderResults(); }
}
function deleteResult(fid) {
  if (db) db.ref('fnc33/results/'+fid).remove();

}

// ── MANAGEMENT ───────────────────────────────────────────────
function updateMgrUI() {
  const btn=document.getElementById('mgr-btn');
  const lbl=document.getElementById('mgr-label');
  const dz=document.getElementById('mgr-dz');

}
function openMgrModal() {
  const modal=document.getElementById('pwd-modal');
  const inner=document.getElementById('modal-inner');
  modal.classList.remove('hidden');
  if (isManager) {
    inner.innerHTML=`<div class="modal-title">🔓 Management Mod</div>
      <div class="modal-sub">Trenutno si u management modu.</div>
      <div class="modal-btns">
        <button class="btn btn-d btn-full btn-md" onclick="logoutMgr()">Izaći iz management moda</button>

      </div>`;
  } else {
    inner.innerHTML=`<div class="modal-title">🔐 Management</div>
      <div class="modal-sub">Unesite šifru za upravljanje rezultatima</div>
      <input type="password" class="pwd-input" id="pwd-input" placeholder="••••••" maxlength="10"
        onkeydown="if(event.key==='Enter')checkPwd()">
      <div class="pwd-error" id="pwd-error">❌ Pogrešna šifra</div>

        <button class="btn btn-p btn-full btn-md" onclick="checkPwd()">Potvrdi</button>
        <button class="btn btn-g btn-sm" onclick="closeMgrModal()">Odustani</button>
      </div>`;
    setTimeout(()=>{const el=document.getElementById('pwd-input');if(el)el.focus();},50);

}
function checkPwd() {
  const val=document.getElementById('pwd-input').value;
  if (val===MGR_PASSWORD) {
    isManager=true; sessionStorage.setItem('fnc33_mgr',MGR_PASSWORD);
    closeMgrModal(); updateMgrUI(); renderTab(currentTab);
  } else {
    document.getElementById('pwd-error').style.display='block';
    document.getElementById('pwd-input').style.borderColor='var(--red)';
    document.getElementById('pwd-input').value='';
    setTimeout(()=>{const e=document.getElementById('pwd-error');if(e)e.style.display='none';},2000);
  }
}
function logoutMgr() {
  isManager=false; sessionStorage.removeItem('fnc33_mgr');
  closeMgrModal(); updateMgrUI(); renderTab(currentTab);
}
function closeMgrModal() { document.getElementById('pwd-modal').classList.add('hidden'); }

// ── TABS ─────────────────────────────────────────────────────
function goTab(tab) {
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('.nav-btn')[['setup','tickets','live','results'].indexOf(tab)].classList.add('active');
  currentTab=tab; renderTab(tab);
}
function renderTab(tab) {
  if(tab==='setup')   renderSetup();
  if(tab==='tickets') renderTickets();
  if(tab==='live')    renderLive();
  if(tab==='results') renderResults();
}

// ── SETUP ────────────────────────────────────────────────────
function renderSetup() {
  let html = !FB_OK ? `<div class="setup-banner">
    <h3>⚙️ Firebase nije konfigurisan — offline mod</h3>
    <p>Za live sync između uređaja:</p>
    <ol>
      <li>Idite na <strong>console.firebase.google.com</strong> → kreirajte projekat</li>
      <li><strong>Build → Realtime Database → Create database</strong> (test mode)</li>

      <li>Zalijepite config u <code>index.html</code> → push na GitHub</li>
    </ol>
  </div>` : '';

    <div class="fight-locked-row">

}

// ── TICKETS ──────────────────────────────────────────────────
function setActiveP(p) { activeP=p; renderTickets(); }

function renderTickets() {
  document.getElementById('ptabs-row').innerHTML = PARTICIPANTS.map(p => {
    const t=TICKETS[p]||{};
    const filled=FIGHTS.every(f=>t[f.id]&&t[f.id].winnerIdx);
    return `<button class="ptab ${p===activeP?'active':''}" onclick="setActiveP('${p}')">
      ${p}${filled?'<span class="psub">✓ Popunjen</span>':''}
    </button>`;
  }).join('');

  const t=TICKETS[activeP]||{};
  let html='';

  FIGHTS.forEach((f,i) => {
    const pick=t[f.id]||{};
    const wIdx=pick.winnerIdx||0;
    const method=pick.method||'';
    html+=`<div class="card" style="margin-bottom:10px">
      <div class="card-head">
        <span class="badge badge-p">#${i+1}</span>
        <span class="fight-matchup-text">${esc(f.f1)} <em>vs</em> ${esc(f.f2)}</span>

          </div>
          <div class="vs-mid">VS</div>
          <div class="f-btn-ro ${wIdx===2?'sel':''}">
            <img class="f-img" src="${f.i2}" alt="${esc(f.f2)}">
            <div class="f-label">${esc(f.f2)}</div>
            ${wIdx===2&&method?`<div style="text-align:center;padding:0 4px"><span class="mpill ${MPILL[method]||'mp-ost'}">${method}</span></div>`:''}
          </div>
        </div>
        ${!wIdx?'<div style="font-family:Barlow Condensed;font-size:13px;color:var(--muted);font-style:italic;text-align:center;padding:4px 0">nije popunjeno</div>':''}
      </div>

// ── LIVE ─────────────────────────────────────────────────────
function setResultWinner(fid,wIdx) {
  if(!isManager) return;
  writeResult(fid,{...(results[fid]||{}),winnerIdx:wIdx});
}
function setResultMethod(fid,mIdx) {
  if(!isManager) return;
  writeResult(fid,{...(results[fid]||{}),method:METHODS[mIdx]});
}
function clearResult(fid) { if(isManager) deleteResult(fid); }

function renderLive() {
  const done=FIGHTS.filter(f=>{const r=results[f.id];return r&&r.winnerIdx&&r.method;}).length;
  document.getElementById('pbar-fill').style.width=(done/FIGHTS.length*100)+'%';
  let html='';

  if (isManager) {
    html+=`<div class="mgr-banner"><span style="font-size:18px">🔓</span> Management mod aktivan — možeš unositi rezultate</div>`;
  } else {
    html+=`<p class="info">${done} / ${FIGHTS.length} borbi završeno${FB_OK?' · <span class="sync-dot"></span>Live sync':' · Offline'}</p>`;
  }

  FIGHTS.forEach((f,i) => {
    const r=results[f.id]||{};
    const isDone=r.winnerIdx&&r.method;

    if (isDone) {
      const winner=r.winnerIdx===1?f.f1:f.f2;
      const mc=MTAG[r.method]||'mt-ost';
      html+=`<div class="card" style="border-color:var(--green);margin-bottom:10px">
        <div class="card-head">
          <span class="dot dot-done"></span>
          <span class="badge badge-g">#${i+1}</span>
          <span class="fight-matchup-text">${esc(f.f1)} <em>vs</em> ${esc(f.f2)}</span>
        </div>
        <div class="result-box">
          <div><div class="winner-s">Pobjednik</div><div class="winner-n">${esc(winner)}</div></div>
          <div style="text-align:right">
            <div style="margin-bottom:6px"><span class="mtag ${mc}">${r.method}</span></div>
            ${isManager?`<button class="edit-btn" onclick="clearResult('${f.id}')">Izmijeni</button>`:''}
          </div>
        </div>
      </div>`;
    } else if (isManager) {
      // Manager: photo pick buttons
      const wIdx=r.winnerIdx||0, method=r.method||'';
      html+=`<div class="card" style="${wIdx||method?'border-color:var(--accent)':''};margin-bottom:10px">
        <div class="card-head">
          <span class="dot ${wIdx||method?'dot-pend':'dot-idle'}"></span>
          <span class="badge badge-p">#${i+1}</span>
          <span class="fight-matchup-text">${esc(f.f1)} <em>vs</em> ${esc(f.f2)}</span>
        </div>
        <div class="card-body">
          <div class="pick-label">Ko je pobijedio?</div>
          <div class="fighter-row" style="margin-bottom:12px">
            <button class="f-btn ${wIdx===1?'wsel':''}" onclick="setResultWinner('${f.id}',1)">
              <div class="sel-check">✓</div>
              <img class="f-img" src="${f.i1}" alt="${esc(f.f1)}">
              <div class="f-label">${esc(f.f1)}</div>
            </button>
            <div class="vs-mid">VS</div>
            <button class="f-btn ${wIdx===2?'wsel':''}" onclick="setResultWinner('${f.id}',2)">
              <div class="sel-check">✓</div>
              <img class="f-img" src="${f.i2}" alt="${esc(f.f2)}">
              <div class="f-label">${esc(f.f2)}</div>
            </button>
          </div>
          <div class="pick-label">Način pobjede</div>
          <div class="method-btns">
            ${METHODS.map((m,mi)=>`<button class="method-btn ${method===m?MBTN[m]:''}" onclick="setResultMethod('${f.id}',${mi})">${m}</button>`).join('')}
          </div>
        </div>
      </div>`;
    } else {
      // Read-only pending
      html+=`<div class="card" style="margin-bottom:10px">
        <div class="card-head">
          <span class="dot dot-idle"></span>
          <span class="badge badge-p">#${i+1}</span>
          <span class="fight-matchup-text">${esc(f.f1)} <em>vs</em> ${esc(f.f2)}</span>
        </div>
        <div class="fight-pending-ro">
          <div class="fp-names">
            <div class="fp-f1">${esc(f.f1)}</div>
            <div class="fp-vs">VS</div>
            <div class="fp-f2">${esc(f.f2)}</div>
          </div>
          <span class="pending-tag">⏳ Na čekanju</span>
        </div>
      </div>`;
    }
  });

  document.getElementById('live-view').innerHTML = html;
}

// ── RESULTS ──────────────────────────────────────────────────
function calcScores() {
  const scores={};
  PARTICIPANTS.forEach(p=>{scores[p]={total:0,wPts:0,mPts:0,rows:[]};});
  FIGHTS.forEach((f,i) => {
    const r=results[f.id]||{};
    const isDone=r.winnerIdx&&r.method;
    PARTICIPANTS.forEach(p => {
      const pick=(TICKETS[p]&&TICKETS[p][f.id])||{};
      let wPt=0,mPt=0,status='pending';
      if(isDone&&pick.winnerIdx) {
        if(pick.winnerIdx===r.winnerIdx){wPt=1;status='w-only';if(pick.method===r.method){mPt=1;status='both';}}
        else{status='wrong';}
      } else if(!pick.winnerIdx){status='no-pick';}
      scores[p].wPts+=wPt;scores[p].mPts+=mPt;scores[p].total+=wPt+mPt;
      scores[p].rows.push({num:i+1,f1:f.f1,f2:f.f2,
        pickedWinner:pick.winnerIdx?(pick.winnerIdx===1?f.f1:f.f2):'—',
        pickedMethod:pick.method||'—',wPt,mPt,status});
    });
  });
  return scores;
}

function renderResults() {
  const scores=calcScores();
  const ranked=PARTICIPANTS.map(p=>({name:p,...scores[p]})).sort((a,b)=>b.total-a.total||a.name.localeCompare(b.name));
  const medals=['🥇','🥈','🥉','',''];
  const rc=['r1','r2','r3','rn','rn'];

  let sb='<div class="card">';
  ranked.forEach((s,i)=>{
    sb+=`<div class="score-row">
      <div class="rank-n ${rc[i]}">${medals[i]||i+1}</div>
      <div class="score-nm">${s.name}</div>
      <div><div class="score-pts">${s.total}</div><div class="score-sub">${s.wPts} borci + ${s.mPts} načini</div></div>
    </div>`;
  });
  sb+='</div>';
  document.getElementById('scoreboard-view').innerHTML=sb;

  let bd='';
  PARTICIPANTS.forEach(p=>{
    const d=scores[p];
    const hasT=FIGHTS.some(f=>TICKETS[p]&&TICKETS[p][f.id]&&TICKETS[p][f.id].winnerIdx);
    bd+=`<div class="card" style="margin-bottom:16px">
      <div class="card-head" style="justify-content:space-between">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:1px">${p}</span>
          ${!hasT?'<span style="font-family:Barlow Condensed;font-size:11px;color:var(--muted)">listić nije popunjen</span>':''}
        </div>
        <span style="font-family:\'Bebas Neue\',cursive;font-size:22px;color:var(--accent)">${d.total} bod${d.total!==1?'a':''}</span>
      </div>
      <table class="btable"><thead><tr>
        <th>#</th><th>Borba</th><th>Tip (Pobjednik)</th><th>Tip (Način)</th><th>Pts</th>
      </tr></thead><tbody>`;
    d.rows.forEach(row=>{
      let wC='tp',mC='tp',pts=0;
      if(row.status==='wrong'){wC='tw';mC='tw';}
      else if(row.status==='w-only'){wC='tc';mC='tw';pts=1;}
      else if(row.status==='both'){wC='tc';mC='tc';pts=2;}
      bd+=`<tr>
        <td class="tp" style="font-size:12px">${row.num}</td>
        <td class="tp" style="font-size:12px;line-height:1.4">${esc(row.f1)}<br>${esc(row.f2)}</td>
        <td class="${wC}">${esc(row.pickedWinner)}</td>
        <td class="${mC}">${esc(row.pickedMethod)}</td>
        <td>${row.status!=='pending'&&row.status!=='no-pick'
          ?`<span class="pts-pill ${pts>0?'pts-ok':'pts-0'}">${pts>0?'+'+pts:'0'}</span>`
          :'<span class="pts-pill pts-0">—</span>'}</td>
      </tr>`;
    });
    bd+='</tbody></table></div>';
  });
  document.getElementById('breakdown-view').innerHTML=bd;
}

// ── RESET ────────────────────────────────────────────────────
function resetResults() {
  if(!isManager||!confirm('Obrisati SVE rezultate?')) return;
  if(db) db.ref('fnc33/results').remove();
  else{results={};localSave();renderTab(currentTab);}
}

// ── UTIL ─────────────────────────────────────────────────────
function esc(s){
  if(!s)return'';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── INIT ─────────────────────────────────────────────────────
updateMgrUI();
renderSetup();
if(!FB_OK){renderLive();renderResults();}

// ── SERVICE WORKER (PWA) ─────────────────────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
